name: skill-truth

# Do the skills still tell the truth about the world?
#
# Two of the three checkers need nothing but the network, so they run here:
#
#   check_versions.py            reads dependencies.sh and tgui/packages/tgui/package.json
#                                from six canonical upstreams and diffs the pins against
#                                the committed baseline.
#   verify_claims.py             reads the canonical repositories through the GitHub trees
#     --source upstream          API and checks the path claims. No clone involved.
#
# The third mode -- verify_claims.py against local checkouts -- deliberately does NOT
# run here. Its grep and commit_rank checks need SS13 forks cloned on disk, and CI has
# none. Cloning six game codebases to answer "does this folder exist" would be absurd,
# and the upstream mode answers it properly anyway.
#
# Weekly, because that is the cadence the pins actually move at, plus on any change to
# the checkers themselves so a broken checker is caught immediately.

on:
  schedule:
    - cron: '17 6 * * 1'          # Mondays, 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'plugins/**/claims.yaml'
      - '.github/workflows/skill-truth.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Repository self-consistency
        run: |
          python scripts/validate_ecosystem.py | tee /tmp/ecosystem.txt

      - name: Upstream package versions
        id: versions
        # Fails when a pin has moved. That is the alert, not a malfunction: a red
        # badge here means "an upstream bumped something a skill was verified
        # against", and the fix is to re-read the affected claim and then accept
        # the new pins with `check_versions.py --update`.
        run: |
          python scripts/check_versions.py | tee /tmp/versions.txt

      - name: Skill claims against canonical upstreams
        if: always()
        # The trees API allows 60 requests an hour unauthenticated, which one run
        # can exhaust. The runner's token lifts that; `permissions: contents: read`
        # above keeps it read-only, and scripts/_fetch.py only ever sends it to
        # github.com hosts.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_claims.py --source upstream | tee /tmp/claims.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Skill truth check"
            echo ""
            echo "Do the skills still describe the world correctly?"
            echo ""
            echo '### Upstream package versions'
            echo '```'
            sed -n '/Changed since the baseline/,$p' /tmp/versions.txt 2>/dev/null \
              || tail -5 /tmp/versions.txt 2>/dev/null || echo "(step did not run)"
            echo '```'
            echo '### Claims against canonical upstreams'
            echo '```'
            tail -6 /tmp/claims.txt 2>/dev/null || echo "(step did not run)"
            echo '```'
            echo "A moved pin is expected maintenance: re-read the affected claim,"
            echo "then run \`python scripts/check_versions.py --update\` to accept it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-truth-reports
          path: |
            /tmp/versions.txt
            /tmp/claims.txt
            /tmp/ecosystem.txt
          if-no-files-found: ignore
